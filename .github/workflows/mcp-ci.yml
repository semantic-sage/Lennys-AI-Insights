name: MCP server CI
on:
  push:
    branches: [main]
    paths: ['mcp/**', 'src/data/**', '.github/workflows/mcp-ci.yml']
  pull_request:
    paths: ['mcp/**', 'src/data/**', '.github/workflows/mcp-ci.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
